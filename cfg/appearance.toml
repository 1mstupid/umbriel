[appearance]
prefer_no_csd = true
border_width = 0
outer_border_width = 0
corner_radius = 20
drag_opacity = 1.0
opaque_fullscreen = true


[colors]
backdrop = "#00000000"
shadow = "#000000FF"

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 8
noise = 0.3
saturation = 0.95
brightness = 0.44
contrast = 1

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 0
